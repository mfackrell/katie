name: Mission84 catalog settlement and one owner retry qualification
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123200400_mission84_provider_catalog_settlement.sql'
      - 'lib/projects/mission84-provider-retry.ts'
      - 'components/mission84-provider-retry-control.tsx'
      - 'app/api/projects/organization/route.ts'
      - 'app/api/projects/route.ts'
      - 'components/director-recovery-control.tsx'
      - 'tests/mission84-provider-retry-runtime.test.mjs'
      - 'tests/helpers/assert-original-bounded-recovery-native.mjs'
      - '.github/workflows/mission84-provider-qualification.yml'
permissions:
  contents: read
jobs:
  mission84-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-only
      SUPABASE_SERVICE_ROLE_KEY: synthetic-service-only
      KATIE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated native PostgreSQL 16
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - name: Owner authentication and UI negatives
        run: node --test tests/mission84-provider-retry-runtime.test.mjs tests/original-bounded-recovery-runtime.test.mjs
      - name: Exact catalog self-deadlock, idempotent settlement, signed retry and normal scheduler
        run: node --test tests/original-bounded-recovery-postgres.test.mjs
      - name: TypeScript and production build
        run: |
          npm run typecheck
          npm run build
