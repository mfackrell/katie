name: website-evidence-validation
on:
  push:
    branches:
      - fix/website-visual-evidence
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'process.stdout.write("GENERATED_LOCK_START" + JSON.stringify(require("./package-lock.json")) + "GENERATED_LOCK_END\n")'
      - name: Install dependencies
        run: npm ci
      - name: Run CI gate
        run: npm run ci:gate
