name: Katie autonomous development

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored issue to build
        type: number
        required: true

permissions:
  actions: read # Read the same task's retained, trusted recovery diagnostics.
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: katie-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[agent]') && github.event.issue.user.login == github.repository_owner) }}
    runs-on: ubuntu-latest
    # Two bounded isolated verifications plus native review/repair fit the owner window.
    timeout-minutes: 120
    outputs:
      branch: ${{ steps.task.outputs.branch }}
      issue: ${{ steps.task.outputs.issue }}
      pr: ${{ steps.publish.outputs.pr }}
      repair_smoke: ${{ steps.task.outputs.repair_smoke }}
      project: ${{ steps.task.outputs.project }}
      project_id: ${{ steps.task.outputs.project_id }}
      contract_hash: ${{ steps.task.outputs.contract_hash }}
      scenario_count: ${{ steps.task.outputs.scenario_count }}
      native: ${{ steps.task.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify GitHub Actions has a Codex API key
        env:
          CODEX_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$CODEX_KEY_CONFIGURED" != "true" ]; then
            echo "::error::OPENAI_API_KEY is missing from this repository's GitHub Actions secrets. Vercel variables are not automatically shared with GitHub Actions."
            exit 1
          fi
      - run: npm ci
      - name: Create isolated branch and task
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPAIR_SMOKE: ${{ github.event_name == 'issues' && contains(github.event.issue.title, '[repair-smoke]') }}
          KATIE_NATIVE_HANDOFF_HMAC_KEY: ${{ secrets.KATIE_NATIVE_HANDOFF_HMAC_KEY }}
        run: |
          set -euo pipefail
          author="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"
          test "$author" = "$GITHUB_REPOSITORY_OWNER" || { echo 'Only owner-authored issues are authorized'; exit 1; }
          # Reject duplicate issue dispatch before costly implementation or branch creation.
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,title,body |
            node -e '
              let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{
                const issue=process.argv[1],prs=JSON.parse(s);
                const found=prs.filter(p=>new RegExp("(^|[^0-9])#"+issue+"(?![0-9])").test((p.title||"")+" "+(p.body||"")));
                process.stdout.write(found.map(p=>"#"+p.number).join(","));
              });' "$ISSUE")"
          if [ -n "$existing" ]; then
            echo "::error::Issue #$ISSUE has existing open PR(s): $existing. Continue those PRs instead of dispatching duplicate implementation."
            exit 1
          fi
          branch="agent/issue-$ISSUE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body --jq '.title + "\n\n" + (.body // "")' > "$RUNNER_TEMP/original-agent-request.md"
          # These tools are captured from the trusted workflow/main checkout,
          # before switching to a prior project commit or running generated code.
          mkdir -p "$RUNNER_TEMP/project-tools" "$RUNNER_TEMP/agent-task"
          cp scripts/project-game-rules.mjs scripts/project-game-check.mjs scripts/project-context.mjs scripts/project-browser-check.mjs scripts/project-sandbox.mjs scripts/project-ci.mjs scripts/project-scope.mjs scripts/project-browser-engine.mjs scripts/recovery-scope.mjs "$RUNNER_TEMP/project-tools/"
          node scripts/request-envelope.mjs unpack "$RUNNER_TEMP/original-agent-request.md"
          # Ordinary owner-authored projects must not depend on benchmark files.
          if grep -Eq '<!--[[:space:]]*katie-native-benchmark:' "$RUNNER_TEMP/original-agent-request.md"; then
            mkdir -p "$RUNNER_TEMP/native-host"
            cp scripts/benchmark/{native-runtime-capsule,native-dispatch-contract,native-dispatch-cli,native-development-host,native-development-child,native-execution-evidence,native-wip-checkpoint,native-wip-recovery,native-development-lifecycle,native-http-bridge,native-provider-receipts,native-child-preflight,native-request-admission,authenticated-native-gateway,paid-dollar-ceiling,native-trust-boundary,shared-native-phase,shared-native-policy,shared-native-container}.mjs "$RUNNER_TEMP/native-host/"
            node "$RUNNER_TEMP/native-host/native-dispatch-cli.mjs" verify "$RUNNER_TEMP/original-agent-request.md" "$RUNNER_TEMP/native-benchmark.json"
          else
            echo '{"native":false}' > "$RUNNER_TEMP/native-benchmark.json"
          fi
          native="$(jq -r '.native' "$RUNNER_TEMP/native-benchmark.json")"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          node scripts/project-context.mjs prepare "$RUNNER_TEMP/original-agent-request.md" > "$RUNNER_TEMP/project-context.json"
          node scripts/recovery-scope.mjs prepare "$RUNNER_TEMP/original-agent-request.md" > "$RUNNER_TEMP/recovery-context.json"
          project="$(jq -r 'if . == null then "false" else "true" end' "$RUNNER_TEMP/project-context.json")"
          recovery="$(jq -r 'if . == null then "false" else "true" end' "$RUNNER_TEMP/recovery-context.json")"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          if [ "$project" = true ]; then
            base_sha="$(jq -r .baseSha "$RUNNER_TEMP/project-context.json")"
            if [ "$recovery" = true ]; then
              test "$(jq -r .sourceSha "$RUNNER_TEMP/recovery-context.json")" = "$base_sha" || { echo 'Recovery and project commit differ'; exit 1; }
            fi
            echo "project_id=$(jq -r .projectId "$RUNNER_TEMP/project-context.json")" >> "$GITHUB_OUTPUT"
            echo "contract_hash=$(jq -r .contractHash "$RUNNER_TEMP/project-context.json")" >> "$GITHUB_OUTPUT"
            echo "scenario_count=$(jq -r '.contract.scenarios | length' "$RUNNER_TEMP/project-context.json")" >> "$GITHUB_OUTPUT"
            echo "coding_model=$(jq -r '.codingModel // ""' "$RUNNER_TEMP/project-context.json")" >> "$GITHUB_OUTPUT"
            echo "review_model=$(jq -r '.reviewModel // ""' "$RUNNER_TEMP/project-context.json")" >> "$GITHUB_OUTPUT"
            gh auth setup-git
            git fetch --no-tags origin "$base_sha"
            git switch -c "$branch" "$base_sha"
          elif [ "$recovery" = true ]; then
            source_sha="$(jq -r .sourceSha "$RUNNER_TEMP/recovery-context.json")"
            gh auth setup-git
            git fetch --no-tags origin "$source_sha"
            git switch -c "$branch" "$source_sha"
          else
            git switch -c "$branch"
          fi
          cp "$RUNNER_TEMP/original-agent-request.md" AGENT_REQUEST.md
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "repair_smoke=$REPAIR_SMOKE" >> "$GITHUB_OUTPUT"
          cp AGENT_REQUEST.md "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md"
      - name: Preserve original task before implementation
        uses: actions/upload-artifact@v4
        with:
          name: agent-task
          path: ${{ runner.temp }}/agent-task/AGENT_REQUEST.md
          if-no-files-found: error
      - name: Preserve trusted project acceptance tools
        uses: actions/upload-artifact@v4
        with:
          name: project-tools
          path: ${{ runner.temp }}/project-tools/*.mjs
          if-no-files-found: error
      - name: Install pinned native SDK for benchmark-bound engineering
        if: steps.task.outputs.native == 'true'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @openai/codex-sdk@0.164.0
          command -v bwrap >/dev/null || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          command -v socat >/dev/null || (sudo apt-get update && sudo apt-get install -y socat)
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Run approved native Developer through trusted gateway
        if: steps.task.outputs.native == 'true'
        env:
          KATIE_NATIVE_HANDOFF_HMAC_KEY: ${{ secrets.KATIE_NATIVE_HANDOFF_HMAC_KEY }}
          KATIE_BENCHMARK_SERVICE_ROLE_KEY: ${{ secrets.KATIE_NONFULL_STAGING_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://iytvavgbaainnsrecmcx.supabase.co
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KATIE_BENCHMARK_PAID_EXECUTION: ${{ vars.KATIE_BENCHMARK_PAID_EXECUTION }}
          KATIE_BENCHMARK_APPROVED_ARM_USD_CENTS: ${{ vars.KATIE_BENCHMARK_APPROVED_ARM_USD_CENTS }}
          KATIE_BENCHMARK_APPROVED_MAX_USD_MICROS_PER_MILLION: ${{ vars.KATIE_BENCHMARK_APPROVED_MAX_USD_MICROS_PER_MILLION }}
          KATIE_BENCHMARK_GATEWAY_DIAGNOSTICS: enabled
          KATIE_NATIVE_EVIDENCE_FILE: ${{ runner.temp }}/native-metered-review.json
          KATIE_NATIVE_CHECKPOINT_BRANCH: ${{ steps.task.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$RUNNER_TEMP/native-host/native-development-host.mjs" "$RUNNER_TEMP/original-agent-request.md" "$RUNNER_TEMP/native-benchmark.json" "$RUNNER_TEMP/native-host/native-development-child.mjs"
      - name: Preserve trusted native review evidence
        if: always() && steps.task.outputs.native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-metered-review
          path: ${{ runner.temp }}/native-metered-review.json
          if-no-files-found: ignore
      - name: Preserve bounded native execution diagnostics
        if: always() && steps.task.outputs.native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-execution-diagnostics
          path: ${{ runner.temp }}/native-metered-review.json.diagnostics.json
          retention-days: 7
          if-no-files-found: error
      - name: Autonomous developer
        if: steps.task.outputs.native != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ steps.task.outputs.coding_model }}
          permission-profile: ':workspace'
          prompt: |
            You are Katie's implementation agent. Read AGENT_REQUEST.md and
            deliver the requested working code and regression tests. Investigate
            the existing architecture before editing. Run relevant tests and
            fix failures autonomously. Preserve production behavior and actor
            isolation. Do not deploy, merge, push, access production resources,
            or rewrite this orchestration workflow. The workflow will commit
            changes, independently test, review, and repair them.
      - name: Controlled failing regression for repair-pipeline smoke test
        if: ${{ steps.task.outputs.repair_smoke == 'true' }}
        shell: bash
        run: |
          # Owner-authored opt-in pilot only. Inject a deliberately incorrect
          # expectation on an isolated branch, never on main.
          cat > tests/agent-repair-smoke.test.mjs <<'SMOKE'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          test("root workspace is private", () => {
            const pkg = JSON.parse(readFileSync(new URL("../package.json", import.meta.url), "utf8"));
            // Fault injection: the true expected value is true, not false.
            // Repair the expectation while retaining this regression test.
            assert.equal(pkg.private, false);
          });
          SMOKE
      - name: Reject smoke artifacts in ordinary tasks
        env:
          REPAIR_SMOKE: ${{ steps.task.outputs.repair_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REPAIR_SMOKE" in
            true) ;;
            false)
              test ! -e tests/agent-repair-smoke.test.mjs && test ! -L tests/agent-repair-smoke.test.mjs || {
                echo 'Smoke-test artifact is forbidden in an ordinary task'; exit 1;
              } ;;
            *) echo 'Missing or invalid repair-smoke mode'; exit 1 ;;
          esac
      - name: Create draft pull request
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.task.outputs.issue }}
          BRANCH: ${{ steps.task.outputs.branch }}
          NATIVE: ${{ steps.task.outputs.native }}
        run: |
          set -euo pipefail
          # Candidate code never gets to select Git hooks, monitoring helpers,
          # diff programs or external protocols during credentialed publication.
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.pager=cat -c diff.external= -c protocol.ext.allow=never "$@"; }
          # Do not create another implementation PR for an issue that already
          # has an open PR. The orchestrator must recover/continue existing work.
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,title,body |
            node -e '
              let s=""; process.stdin.on("data",x=>s+=x); process.stdin.on("end",()=>{
                const issue=process.argv[1], branch=process.argv[2];
                const prs=JSON.parse(s);
                const hits=prs.filter(p=>p.headRefName===branch ||
                  new RegExp("(^|[^0-9])#"+issue+"(?![0-9])").test((p.title||"")+" "+(p.body||"")));
                if(hits.length)process.stdout.write(hits.map(p=>"#"+p.number).join(","));
              });' "$ISSUE" "$BRANCH")"
          if [ -n "$existing" ]; then
            echo "::error::Existing open PR(s) $existing already address issue #$ISSUE. Resume or review that work; no duplicate PR created."
            exit 1
          fi
          rm -f AGENT_REQUEST.md
          test -z "$(git status --porcelain -- .github/workflows/autonomous-development.yml)" || { echo 'Protected workflow edited'; exit 1; }
          if [[ "$NATIVE" == true ]]; then
            test -z "$(git status --porcelain)" || { echo 'Native candidate changed after trusted review'; exit 1; }
            node "$RUNNER_TEMP/project-tools/project-scope.mjs" "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md" --verify-committed
            jq -e --arg sha "$(git rev-parse HEAD)" '.metered == true and .completed == true and .reviewedHeadSha == $sha and .finalReview.verdict == "pass"' "$RUNNER_TEMP/native-metered-review.json" >/dev/null || { echo 'Trusted native review SHA mismatch'; exit 1; }
          else
            git add -A
            git diff --cached --quiet && { echo 'No implementation produced'; exit 1; }
            node "$RUNNER_TEMP/project-tools/project-scope.mjs" "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md"
            node "$RUNNER_TEMP/project-tools/recovery-scope.mjs" "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "agent: implement issue #$ISSUE"
          fi
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$BRANCH" --title "[agent] Implementation for issue #$ISSUE" --body "Automated development for #$ISSUE. No merge or production deployment authorized. Test and independent review results follow.")"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: needs.build.outputs.project != 'true'
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: agent-task
          path: ${{ runner.temp }}/agent-task
      - uses: actions/download-artifact@v4
        with:
          name: project-tools
          path: ${{ runner.temp }}/project-tools
      - name: Ensure trusted filesystem and user namespace isolation is available
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb || { echo 'PostgreSQL 16 initdb is required for DB integration tests'; exit 1; }
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          command -v bwrap >/dev/null || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          # Check sandbox capability without relying on privileged sysctl changes.
          # Never fall back to unsandboxed browser or code execution.
          if ! unshare --user --map-root-user /bin/true >/dev/null 2>&1; then
            echo 'Sandbox unavailable: runner cannot create UID-mapped user namespace.' >&2
            exit 1
          fi
          if ! bwrap --unshare-user --ro-bind / / -- /bin/true >/dev/null 2>&1; then
            echo 'Sandbox unavailable: runner does not permit unprivileged bubblewrap user namespaces.' >&2
            echo 'Use a runner with user namespaces enabled; do not weaken filesystem/network isolation.' >&2
            exit 1
          fi
      - name: Independent verification
        id: check
        shell: bash
        env:
          NATIVE: ${{ needs.build.outputs.native }}
          PROJECT: ${{ needs.build.outputs.project }}
          CI: 'true'
          VERCEL_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
        run: |
          set +e
          if [[ "${PROJECT:-false}" == true ]]; then
            node "$RUNNER_TEMP/project-tools/project-ci.mjs" --request "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md" --output "$RUNNER_TEMP/project-acceptance.json" > agent-test.log 2>&1
          else
            { npm run typecheck && npm run ci:gate; } > agent-test.log 2>&1
          fi
          rc=$?
          cat agent-test.log
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then echo 'passed=true' >> "$GITHUB_OUTPUT"; else echo 'passed=false' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: agent-test
          path: agent-test.log
      - name: Preserve actual project browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-browser-test
          path: |
            ${{ runner.temp }}/project-acceptance.json
            ${{ runner.temp }}/project-game-model.json
          if-no-files-found: ignore

  review:
    needs: [build, test]
    if: needs.build.outputs.native != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head_sha: ${{ steps.verdict.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load preserved original objective
        uses: actions/download-artifact@v4
        with:
          name: agent-task
      - uses: actions/download-artifact@v4
        with:
          name: agent-test
      - name: Independent read-only reviewer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ steps.task.outputs.review_model }}
          permission-profile: ':read-only'
          output-schema: '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","changes_requested"]},"summary":{"type":"string"},"blocking_findings":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","blocking_findings"],"additionalProperties":false}'
          output-file: agent-review.json
          prompt: |
            You are a NEW independent reviewer. Do not change files.
            Read AGENT_REQUEST.md, agent-test.log, and
            git diff origin/main...HEAD. Evaluate whether the change
            satisfies the user's actual goal, preserves behavior,
            contains appropriate tests, and introduces no security risks
            or CI bypasses. Return structured JSON. Request changes for
            any blocking findings with actionable file-specific detail.
      - name: Verify review output
        id: verdict
        run: |
          set -euo pipefail
          jq -e '.verdict == "pass" or .verdict == "changes_requested"' agent-review.json >/dev/null
          echo "verdict=$(jq -r .verdict agent-review.json)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-review
          path: agent-review.json

  repair:
    needs: [build, test, review]
    if: ${{ needs.review.result == 'success' && (needs.test.outputs.passed != 'true' || needs.review.outputs.verdict != 'pass') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      passed: ${{ steps.retest.outputs.passed }}
      head_sha: ${{ steps.retest.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: needs.build.outputs.project != 'true'
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: agent-test
      - uses: actions/download-artifact@v4
        with:
          name: agent-review
      - name: Load preserved task for repair
        uses: actions/download-artifact@v4
        with:
          name: agent-task
          path: ${{ runner.temp }}/agent-task
      - uses: actions/download-artifact@v4
        with:
          name: project-tools
          path: ${{ runner.temp }}/project-tools
      - name: Prepare task-specific repair instructions
        env:
          REPAIR_SMOKE: ${{ needs.build.outputs.repair_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md" AGENT_REQUEST.md
          case "$REPAIR_SMOKE" in
            true)
              cat > AGENT_REPAIR_CONTEXT.md <<'CONTEXT'
          This is an owner-authorized repair-smoke run. The workflow deliberately
          injected tests/agent-repair-smoke.test.mjs after implementation.
          Retain that regression and correct its intentionally wrong expectation
          to private: true. Preserve the original task's remaining boundaries.
          CONTEXT
              ;;
            false)
              cat > AGENT_REPAIR_CONTEXT.md <<'CONTEXT'
          This is an ordinary task. Do not create or reintroduce
          tests/agent-repair-smoke.test.mjs. It belongs only to controlled pilots.
          Follow the original task's scope, prohibitions, and acceptance criteria.
          CONTEXT
              ;;
            *) echo 'Missing or invalid repair-smoke mode'; exit 1 ;;
          esac
      - name: Independent repair agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ steps.task.outputs.coding_model }}
          permission-profile: ':workspace'
          prompt: |
            You are the repair agent in a fresh context. First read
            AGENT_REQUEST.md and AGENT_REPAIR_CONTEXT.md, then agent-test.log
            and agent-review.json. Diagnose failures and blocking findings
            against the original task. Fix them within its scope and verify
            locally. Reviewer suggestions do not authorize scope expansion.
            Do not weaken tests, rewrite the agent workflow, access production,
            push, merge, or deploy. Leave an unresolved requirement blocked
            rather than substituting a different result.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject smoke artifacts in ordinary tasks
        env:
          REPAIR_SMOKE: ${{ needs.build.outputs.repair_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REPAIR_SMOKE" in
            true) ;;
            false)
              test ! -e tests/agent-repair-smoke.test.mjs && test ! -L tests/agent-repair-smoke.test.mjs || {
                echo 'Smoke-test artifact is forbidden in an ordinary task'; exit 1;
              } ;;
            *) echo 'Missing or invalid repair-smoke mode'; exit 1 ;;
          esac
      - name: Push repairs
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.build.outputs.branch }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- .github/workflows/autonomous-development.yml)" || { echo 'Protected workflow edited'; exit 1; }
          rm -f AGENT_REQUEST.md AGENT_REPAIR_CONTEXT.md agent-test.log agent-review.json
          git add -A
          git diff --cached --quiet && { echo 'No repair produced'; exit 1; }
          node "$RUNNER_TEMP/project-tools/project-scope.mjs" "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md"
          node "$RUNNER_TEMP/project-tools/recovery-scope.mjs" "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'agent: repair test and review failures'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Ensure project filesystem isolation is available
        run: |
          command -v bwrap >/dev/null || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          # Check sandbox capability without relying on privileged sysctl changes.
          # Never fall back to unsandboxed browser or code execution.
          if ! bwrap --unshare-user --ro-bind / / -- /bin/true >/dev/null 2>&1; then
            echo 'Sandbox unavailable: runner does not permit unprivileged bubblewrap user namespaces.' >&2
            echo 'Use a runner with user namespaces enabled; do not weaken filesystem/network isolation.' >&2
            exit 1
          fi
      - name: Reverify repaired tree
        id: retest
        shell: bash
        env:
          PROJECT: ${{ needs.build.outputs.project }}
          CI: 'true'
          VERCEL_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
        run: |
          set +e
          if [[ "${PROJECT:-false}" == true ]]; then
            node "$RUNNER_TEMP/project-tools/project-ci.mjs" --request "$RUNNER_TEMP/agent-task/AGENT_REQUEST.md" --output "$RUNNER_TEMP/project-acceptance.json" > agent-retest.log 2>&1
          else
            { npm run typecheck && npm run ci:gate; } > agent-retest.log 2>&1
          fi
          rc=$?
          cat agent-retest.log
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then echo 'passed=true' >> "$GITHUB_OUTPUT"; else echo 'passed=false' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: agent-retest
          path: agent-retest.log
      - name: Preserve repaired project browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-browser-retest
          path: |
            ${{ runner.temp }}/project-acceptance.json
            ${{ runner.temp }}/project-game-model.json
          if-no-files-found: ignore

  final-review:
    needs: [build, repair]
    if: needs.repair.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head_sha: ${{ steps.verdict.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load preserved original objective
        uses: actions/download-artifact@v4
        with:
          name: agent-task
      - uses: actions/download-artifact@v4
        with:
          name: agent-retest
      - name: Independent final review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ steps.task.outputs.review_model }}
          permission-profile: ':read-only'
          output-schema: '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","changes_requested"]},"summary":{"type":"string"},"blocking_findings":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","blocking_findings"],"additionalProperties":false}'
          output-file: agent-final-review.json
          prompt: |
            Independently review the entire git diff origin/main...HEAD
            against AGENT_REQUEST.md and agent-retest.log. No changes.
            Return pass only if both tests and requirements are satisfied,
            with no blocking correctness or security concerns. Return
            structured JSON and actionable findings otherwise.
      - name: Validate result
        id: verdict
        run: |
          set -euo pipefail
          jq -e '.verdict == "pass" or .verdict == "changes_requested"' agent-final-review.json >/dev/null
          echo "verdict=$(jq -r .verdict agent-final-review.json)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-final-review
          path: agent-final-review.json

  report:
    needs: [build, test, review, repair, final-review]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[agent]') && github.event.issue.user.login == github.repository_owner)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Load project acceptance evidence
        if: needs.build.outputs.project == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: project-browser-*
          path: ${{ runner.temp }}/project-browser
      - name: Load trusted metered native review
        if: needs.build.outputs.native == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-metered-review
          path: ${{ runner.temp }}/native-review
      - name: Report success or failure to the owner issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.build.outputs.issue || github.event.issue.number || inputs.issue_number }}
          PR: ${{ needs.build.outputs.pr }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.outputs.passed }}
          REVIEW: ${{ needs.review.outputs.verdict }}
          REPAIR: ${{ needs.repair.result }}
          RETEST: ${{ needs.repair.outputs.passed }}
          FINAL: ${{ needs.final-review.outputs.verdict }}
          NATIVE: ${{ needs.build.outputs.native }}
          PROJECT: ${{ needs.build.outputs.project }}
          PROJECT_ID: ${{ needs.build.outputs.project_id }}
          CONTRACT_HASH: ${{ needs.build.outputs.contract_hash }}
          SCENARIO_COUNT: ${{ needs.build.outputs.scenario_count }}
          TEST_HEAD: ${{ needs.test.outputs.head_sha }}
          REVIEW_HEAD: ${{ needs.review.outputs.head_sha }}
          RETEST_HEAD: ${{ needs.repair.outputs.head_sha }}
          FINAL_HEAD: ${{ needs.final-review.outputs.head_sha }}
        run: |
          set -euo pipefail
          outcome='BLOCKED — review or tests require further work'
          if [[ "$REPAIR" == 'skipped' && "$TEST" == 'true' && "$REVIEW" == 'pass' ]]; then
            outcome='READY — awaiting owner approval'
          elif [[ "$REPAIR" == 'success' && "$RETEST" == 'true' && "$FINAL" == 'pass' ]]; then
            outcome='READY — awaiting owner approval'
          fi
          tested_head="$TEST_HEAD"; reviewed_head="$REVIEW_HEAD"
          if [[ "$REPAIR" == 'success' ]]; then tested_head="$RETEST_HEAD"; reviewed_head="$FINAL_HEAD"; fi
          if [[ "$outcome" == READY* ]] && { [[ ! "$tested_head" =~ ^[a-f0-9]{40}$ ]] || [[ "$tested_head" != "$reviewed_head" ]]; }; then
            outcome='BLOCKED — tested and reviewed commits differ or are unavailable'
          fi
          # Native phases run through one trusted metered host, not unmetered
          # review/repair jobs. Verify its authenticated task association and
          # committed review SHA against the separately tested candidate.
          if [[ "${NATIVE:-false}" == true ]]; then
            evidence="$RUNNER_TEMP/native-review/native-metered-review.json"
            outcome='BLOCKED — trusted metered native review missing or mismatched'
            if [[ "$TEST" == true && "$BUILD" == success && "$TEST_HEAD" =~ ^[a-f0-9]{40}$ ]] &&
              jq -e --arg head "$TEST_HEAD" --arg project "$PROJECT_ID" '
                .version == 1 and .metered == true and .completed == true and
                .projectId == $project and .reviewedHeadSha == $head and
                (.review.verdict == "pass" or .review.verdict == "changes_requested") and
                .finalReview.verdict == "pass" and
                ((.repairPerformed == false and .review.verdict == "pass") or
                 (.repairPerformed == true and
                   (.review.verdict == "changes_requested" or
                    (.review.verdict == "pass" and
                     .repairVerification.before.passed == false and
                     (.repairVerification.before.head | type == "string" and test("^[a-f0-9]{40}$")) and
                     .repairVerification.before.head != $head and
                     .repairVerification.after.passed == true and .repairVerification.after.head == $head))))
              ' "$evidence" >/dev/null 2>&1; then
              reviewed_head="$TEST_HEAD"
              tested_head="$TEST_HEAD"
              if [[ "$(jq -r '.repairPerformed' "$evidence")" == true ]]; then
                REVIEW="$(jq -r '.review.verdict' "$evidence")"; REPAIR='success'; RETEST="$TEST"; FINAL='pass'
              else
                REVIEW='pass'; REPAIR='skipped'; RETEST=''; FINAL=''
              fi
              outcome='READY — awaiting owner approval'
            fi
          fi
          acceptance='null'
          if [[ "${PROJECT:-false}" == true ]]; then
            acceptance_file="$RUNNER_TEMP/project-browser/project-browser-test/project-acceptance.json"
            if [[ "$REPAIR" == success && "${NATIVE:-false}" != true ]]; then acceptance_file="$RUNNER_TEMP/project-browser/project-browser-retest/project-acceptance.json"; fi
            if jq -e --arg head "$tested_head" --arg project "$PROJECT_ID" --arg contract "$CONTRACT_HASH" --argjson count "$SCENARIO_COUNT" '
              .version == 1 and .projectId == $project and .contractHash == $contract and
              .headSha == $head and .passed == true and (.checks | type == "array" and length == $count and length > 0) and
              all(.checks[]; .passed == true)
            ' "$acceptance_file" >/dev/null 2>&1; then
              acceptance="$(jq -c . "$acceptance_file")"
            else
              outcome='BLOCKED — approved project browser acceptance is missing or failed'
            fi
          fi
          {
            echo "### Autonomous result: $outcome"
            echo
            echo "- Build: $BUILD; initial tests: $TEST; independent review: $REVIEW"
            echo "- Automated repair: $REPAIR; final tests: $RETEST; final review: $FINAL"
            echo "- [Run logs and review artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo 'No merge or deployment occurred.'
            if [[ -n "$PR" ]]; then echo 'The PR remains a draft pending approval.'; else echo 'No draft PR was produced; inspect the failed workflow before retrying.'; fi
          } > "$RUNNER_TEMP/agent-report.md"
          # The workflow_run notification listener consumes a trusted completion
          # receipt rather than guessing a READY status from job conclusion.
          event_outcome='BLOCKED'
          if [[ "$outcome" == READY* ]]; then event_outcome='READY'; fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg issue "$ISSUE" --arg pr "$PR" --arg result "$event_outcome" \
            --arg build "$BUILD" --arg test "$TEST" --arg review "$REVIEW" \
            --arg repair "$REPAIR" --arg retest "$RETEST" --arg final "$FINAL" \
            --arg tested_head "$tested_head" --arg reviewed_head "$reviewed_head" \
            --argjson project_acceptance "$acceptance" \
            '{
              version: 1, repository: $repo, run_id: ($run | tonumber),
              issue_number: ($issue | tonumber),
              pr_url: (if $pr == "" then null else $pr end),
              outcome: $result,
              tested_head_sha: (if ($tested_head | test("^[a-f0-9]{40}$")) then $tested_head else null end),
              reviewed_head_sha: (if ($reviewed_head | test("^[a-f0-9]{40}$")) then $reviewed_head else null end),
              checks: { build: $build, test: $test, review: $review,
                        repair: $repair, retest: $retest, final_review: $final }
            } + (if $project_acceptance == null then {} else {projectAcceptance: $project_acceptance} end)' > "$RUNNER_TEMP/agent-result.json"
          if [[ -n "$PR" ]]; then gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/agent-report.md"; fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/agent-report.md"
      - name: Upload machine-readable agent completion event
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-completion
          path: ${{ runner.temp }}/agent-result.json
          if-no-files-found: ignore
