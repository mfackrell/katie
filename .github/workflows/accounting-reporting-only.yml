name: accounting-reporting-only
on:
  pull_request:
    paths:
      - 'lib/standalone-accounting/**'
      - 'lib/router/control-plane-economics.ts'
      - 'lib/chat/runpod-still-vision.ts'
      - 'lib/chat/venice-still-vision.ts'
      - 'supabase/migrations/*accounting_reporting_only.sql'
      - 'tests/accounting-reporting-only-postgres.test.mjs'
      - '.github/workflows/accounting-reporting-only.yml'
jobs:
  native-accounting-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Provide disposable native PostgreSQL
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb
          echo "KATIE_TEST_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Verify reporting-only policy, receipts and durable one-shot security
        run: node --test tests/accounting-reporting-only-postgres.test.mjs
