name: Executive saved-work recovery verification
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261024154500_continue_executive_saved_audit.sql'
      - 'supabase/migrations/20261024161000_resume_repository_review_context.sql'
      - 'supabase/migrations/20261024163500_continue_operations_trace_revision.sql'
      - 'supabase/migrations/20261024164500_continue_saved_audit_completion.sql'
      - 'supabase/migrations/20261024171000_continue_audit_factual_corrections.sql'
      - 'supabase/migrations/20261024174000_recover_complete_audit_edits.sql'
      - 'supabase/migrations/20261024181000_finish_audit_contract_repairs.sql'
      - 'supabase/migrations/20261024183000_resume_audit_partial_edits_and_review.sql'
      - 'supabase/migrations/20261024185000_finish_audit_within_existing_ceiling.sql'
      - 'supabase/migrations/20261024191500_complete_operations_factual_closure.sql'
      - 'tests/fixtures/executive-saved-continuation.sql'
      - '.github/workflows/executive-recovery-check.yml'
jobs:
  postgres-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: recovery_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the production migration entry points
        run: |
          node --check scripts/audit-migration-authority.mjs
          node --check scripts/run-migrations.mjs
      - name: Verify real PostgreSQL recovery and idempotence
        run: psql postgresql://postgres:fixture-only@localhost:5432/recovery_fixture -v ON_ERROR_STOP=1 -f tests/fixtures/executive-saved-continuation.sql
