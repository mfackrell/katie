name: Full native accounting race qualification
on:
  pull_request:
    paths:
      - 'tests/benchmark-full-native-race.test.mjs'
      - 'tests/benchmark-nonfull-grant-postgres.test.mjs'
      - 'tests/benchmark-nonfull-postgres-host.test.mjs'
      - 'tests/sql/benchmark-*'
      - 'supabase/migrations/*benchmark*'
      - '.github/workflows/benchmark-native-accounting-race.yml'
  workflow_dispatch:
jobs:
  real-postgres-race:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install available PostgreSQL server binaries
        run: |
          if ! find /usr/lib/postgresql -path '*/bin/initdb' -type f 2>/dev/null | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          PG_INITDB="$(find /usr/lib/postgresql -path '*/bin/initdb' -type f | sort -V | tail -n 1)"
          test -x "$PG_INITDB"
          echo "KATIE_TEST_PG_BIN=$(dirname "$PG_INITDB")" >> "$GITHUB_ENV"
      - name: Two independent connections compete for Full native final mission slot
        run: node --test tests/benchmark-full-native-race.test.mjs
      - name: Native Thin disposable PostgreSQL owner grant issuance and denial
        run: node --test tests/benchmark-nonfull-grant-postgres.test.mjs
      - name: Install nonbillable contained SDK and Unix proxy
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @openai/codex-sdk@0.164.0
          command -v bwrap >/dev/null || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          command -v socat >/dev/null || (sudo apt-get update && sudo apt-get install -y socat)
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Native Thin complete real PostgreSQL grant to SDK to canonical receipts
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
          KATIE_BENCHMARK_PAID_EXECUTION: disabled
        run: node --test tests/benchmark-nonfull-postgres-host.test.mjs
