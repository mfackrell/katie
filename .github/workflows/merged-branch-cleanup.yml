name: Clean up merged pull request branches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete only verified merged branch heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse

          repo = os.environ["REPO"]
          def api(path, method="GET"):
              cmd = ["gh", "api", "--method", method, path]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode:
                  raise RuntimeError(f"GitHub API error: {result.stderr.strip()}")
              return json.loads(result.stdout) if result.stdout.strip() else None

          def get_prs():
              if os.environ["EVENT_NAME"] == "pull_request":
                  return [api(f"repos/{repo}/pulls/{os.environ['EVENT_PR']}")]
              prs = []
              for page in range(1, 11):
                  batch = api(f"repos/{repo}/pulls?state=closed&per_page=100&page={page}")
                  prs.extend(batch)
                  if len(batch) < 100:
                      break
              return prs

          prs = get_prs()
          candidates = {}
          for pr in prs:
              if not pr.get("merged_at"):
                  continue
              head = pr.get("head") or {}
              if (head.get("repo") or {}).get("full_name") != repo:
                  continue
              name = head.get("ref") or ""
              if name in ("main", "master") or not name or name.startswith("release/"):
                  continue
              candidates[name] = (head.get("sha"), pr["number"])

          # Independently protect every open PR, even when a merged PR shared its branch name.
          open_heads = set()
          for page in range(1, 11):
              batch = api(f"repos/{repo}/pulls?state=open&per_page=100&page={page}")
              open_heads.update(p["head"]["ref"] for p in batch if (p.get("head", {}).get("repo") or {}).get("full_name") == repo)
              if len(batch) < 100:
                  break

          removed = 0
          for name, (merged_sha, number) in candidates.items():
              if removed >= 100:
                  break
              if name in open_heads:
                  continue
              encoded = urllib.parse.quote(name, safe="/")
              try:
                  branch = api(f"repos/{repo}/branches/{encoded}")
              except RuntimeError:
                  continue  # Already deleted.
              if branch.get("protected") or branch["commit"]["sha"] != merged_sha:
                  continue  # Never delete a moved branch or protected branch.
              try:
                  api(f"repos/{repo}/git/refs/heads/{encoded}", "DELETE")
                  print(f"Deleted merged branch {name} (PR #{number})")
                  removed += 1
              except RuntimeError as exc:
                  print(f"Skipped {name}: {exc}")
          print(f"Deleted {removed} verified merged branches; open, moved, and protected branches retained.")
          PY
