name: Exhausted coding capacity recovery qualification
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261124173000_owner_coding_capacity_recovery.sql'
      - 'supabase/migrations/20261124193000_mission98_coding_capacity_resume.sql'
      - 'supabase/migrations/20261124195000_mission99_commissioning_identity_resume.sql'
      - 'supabase/migrations/20261124203500_mission102_final_package_authorization.sql'
      - 'supabase/migrations/20261124212500_mission103_smart_capacity_resume.sql'
      - 'supabase/migrations/20261124233000_mission104_package_execution_authority.sql'
      - 'supabase/migrations/20261125143500_package_claim_alias.sql'
      - 'supabase/migrations/20261125144000_package_execution_corrected_release.sql'
      - 'supabase/migrations/20261125151600_package_corrective_continuation.sql'
      - 'supabase/migrations/20261125182700_package_coding_admission.sql'
      - 'supabase/migrations/20261125190000_package_completion_recovery.sql'
      - 'supabase/migrations/20261125202000_package_invalid_response_retry.sql'
      - 'supabase/migrations/20261125210000_pending_invalid_retry_offer_handoff.sql'
      - 'supabase/migrations/20261126160500_package_diagnosed_native_preflight.sql'
      - 'supabase/migrations/20261127165500_retained_native_checkpoint_continuation.sql'
      - '.github/workflows/autonomous-development.yml'
      - 'tests/native-preflight.test.mjs'
      - 'components/chat-panel.tsx'
      - 'scripts/project-context.mjs'
      - 'lib/missions/model.ts'
      - 'tests/package-completion-parser.test.mjs'
      - 'lib/projects/worker.ts'
      - 'lib/projects/package-execution-authorization.ts'
      - 'components/package-execution-control.tsx'
      - 'lib/missions/worker.ts'
      - 'lib/missions/request-budget.ts'
      - 'tests/management-context.test.mjs'
      - 'lib/projects/smart-diagnostics.ts'
      - 'lib/projects/coding-capacity-recovery.ts'
      - 'lib/projects/organization.ts'
      - 'lib/projects/management-context-preflight.ts'
      - 'components/coding-capacity-recovery-control.tsx'
      - 'components/director-recovery-control.tsx'
      - 'app/api/projects/**'
      - 'tests/coding-capacity-*.test.mjs'
      - 'tests/helpers/assert-coding-capacity-native.mjs'
      - 'tests/helpers/assert-management-followup-native.mjs'
      - '.github/workflows/coding-capacity-recovery-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coding-capacity-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-only
      SUPABASE_SERVICE_ROLE_KEY: synthetic-service-only
      KATIE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Mission109 authenticated conversation control in Chromium
        run: node --test tests/coding-capacity-owner-control-browser.test.mjs
      - name: Retained checkpoint authenticated conversation control
        run: node --test tests/coding-capacity-checkpoint-owner-browser.test.mjs
      - run: node --test tests/coding-capacity-owner-runtime.test.mjs tests/management-followup-owner-runtime.test.mjs tests/management-direct-worker-authority.test.mjs
      - run: node --test --test-name-pattern='Registered development contract outranks|Mission108 signed package' tests/missions-runtime.test.mjs
      - run: node --test tests/management-context.test.mjs tests/project-context.test.mjs tests/package-completion-parser.test.mjs
      - name: Mission111 exact pinned runner setup and failure artifact qualification
        env:
          KATIE_QUALIFY_NATIVE_PREFLIGHT: '1'
        run: node --test tests/native-preflight.test.mjs
      - name: Install PostgreSQL 16
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - name: Original 96-mission recovery and real commissioning, rollback only
        run: node --test tests/coding-capacity-native-postgres.test.mjs
