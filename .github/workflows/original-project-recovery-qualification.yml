name: Original 84 mission combined recovery qualification
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123180500_original_project_bounded_recovery.sql'
      - 'lib/projects/original-bounded-recovery.ts'
      - 'components/original-bounded-recovery-control.tsx'
      - 'components/director-recovery-control.tsx'
      - 'app/api/projects/route.ts'
      - 'app/api/projects/organization/route.ts'
      - 'tests/original-bounded-recovery-*.test.mjs'
      - 'tests/helpers/assert-original-bounded-recovery-native.mjs'
      - 'tests/helpers/assert-mission82-independent-native.mjs'
      - '.github/workflows/original-project-recovery-qualification.yml'
permissions:
  contents: read
jobs:
  original-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-only
      SUPABASE_SERVICE_ROLE_KEY: synthetic-service-only
      KATIE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install native PostgreSQL 16
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - name: Authenticated owner UI and unchanged management contracts
        run: node --test tests/original-bounded-recovery-runtime.test.mjs tests/management-context.test.mjs tests/management-commissioning-diagnostics.test.mjs
      - name: Native PostgreSQL 16 expired window, one recovery and two successive scheduler transitions
        run: node --test tests/original-bounded-recovery-postgres.test.mjs
