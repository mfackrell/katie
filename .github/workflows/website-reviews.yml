name: website-reviews
on:
  pull_request:
  push:
    branches:
      - main
      - fix/task4a-separate-dispatch-paid-approval-20261105
permissions:
  contents: read
jobs:
  website-reviews:
    # Browser acceptance must use the known-compatible runtime also used by ci.yml.
    # ubuntu-latest resolved to 26.04 and Chromium stalled before CDP startup.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strict compilation and website regression tests
        run: npm run test:website
      - name: Build and smoke
        run: npm run check:url && npm run build && npm run smoke
