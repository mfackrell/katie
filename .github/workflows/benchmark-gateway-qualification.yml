name: Native gateway qualification
on:
  pull_request:
    paths:
      - 'scripts/benchmark/**'
      - 'supabase/migrations/*benchmark*'
      - '.github/workflows/benchmark-gateway-qualification.yml'
  workflow_dispatch:
  workflow_call:
jobs:
  actual-sdk-input-count:
    needs: native-gateway
    if: github.head_ref == 'qualify/native-sdk-input-count' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: native-sdk-first-count-requests
          path: ${{ runner.temp }}
      - name: Count four actual SDK first requests only (no inference)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/benchmark/native-sdk-input-count-probe.mjs
  provider-input-count:
    if: github.head_ref == 'fix/native-authoritative-count' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify fixed gpt-5.3-codex input counts only (no inference)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/benchmark/native-input-count-probe.mjs
  existing-response-forensics:
    if: github.head_ref == 'fix/native-sdk-replay-metadata' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only two existing responses and emit content-free structure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/benchmark/native-response-shape-forensics.mjs
  native-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ''
      CODEX_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked repository dependencies without hooks
        run: npm ci --ignore-scripts
      - name: Install pinned real Codex SDK
        run: npm install --no-save --package-lock=false --ignore-scripts @openai/codex-sdk@0.164.0
      - name: Install sandbox and permit user namespace inside disposable runner
        run: |
          command -v bwrap >/dev/null || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Install Unix-socket proxy for separated gateway host
        run: command -v socat >/dev/null || (sudo apt-get update && sudo apt-get install -y socat)
      - name: Actual Full child imports pinned ESM SDK before any authority
        run: node scripts/benchmark/native-child-preflight-probe.mjs
      - name: Reproduce prior gateway denial on actual SDK empty logprobs replay at frozen baseline
        env:
          KATIE_BENCHMARK_GATEWAY_DIAGNOSTICS: enabled
          KATIE_NATIVE_PROBE_BASELINE: 0015bcdb8ac9ad94b7c74d1a4cd76737903b1319
          KATIE_NATIVE_PROBE_EXPECT_LOGPROBS_DENIAL: '1'
        run: |
          git fetch origin f6c98c5469dc6744279cce9148c345f9e9f4e820 0015bcdb8ac9ad94b7c74d1a4cd76737903b1319
          restore() { for file in native-request-admission native-http-bridge authenticated-native-gateway; do cp "$RUNNER_TEMP/corrected-$file.mjs" "scripts/benchmark/$file.mjs"; done; }
          trap restore EXIT
          for file in native-request-admission native-http-bridge authenticated-native-gateway; do
            cp "scripts/benchmark/$file.mjs" "$RUNNER_TEMP/corrected-$file.mjs"
            git show "f6c98c5469dc6744279cce9148c345f9e9f4e820:scripts/benchmark/$file.mjs" > "scripts/benchmark/$file.mjs"
          done
          node scripts/benchmark/native-development-child-contained-probe.mjs
      - name: Actual Full child and production model exercise all paid admission checks without billing
        env:
          KATIE_BENCHMARK_GATEWAY_DIAGNOSTICS: enabled
        run: node scripts/benchmark/native-development-child-contained-probe.mjs
      - name: Qualify actual child against immutable production benchmark baseline without billing
        env:
          KATIE_BENCHMARK_GATEWAY_DIAGNOSTICS: enabled
          KATIE_NATIVE_PROBE_BASELINE: 0015bcdb8ac9ad94b7c74d1a4cd76737903b1319
          KATIE_NATIVE_PROBE_CAPTURE_FIRST_REQUESTS: '1'
        run: |
          git fetch origin 0015bcdb8ac9ad94b7c74d1a4cd76737903b1319
          node scripts/benchmark/native-development-child-contained-probe.mjs
      - name: Upload credential-free first-request count fixtures
        uses: actions/upload-artifact@v4
        with:
          name: native-sdk-first-count-requests
          path: ${{ runner.temp }}/native-sdk-first-count-requests.json
          if-no-files-found: error
          retention-days: 1
      - name: Adversarial shared trust boundary (Git, hooks, dependencies, symlinks)
        run: node --test tests/benchmark-native-trust-boundary.test.mjs
      - name: Qualify Native Thin owner grant and canonical HTTP receipt boundaries
        run: node --test tests/benchmark-arm-launch-authority.test.mjs tests/benchmark-nonfull-trusted-grant.test.mjs
      - name: Qualify Native Thin shared trusted host and actual SDK grant-to-receipt flow
        env:
          KATIE_BENCHMARK_GATEWAY_DIAGNOSTICS: enabled
          KATIE_REQUIRE_NATIVE_BWRAP: '1'
        run: node --test tests/benchmark-nonfull-trusted-host.test.mjs
      - name: Qualify separated gateway host and isolated SDK over Unix socket
        run: node scripts/benchmark/external-native-gateway-host-probe.mjs
      - name: Validate signed Developer dispatch scripts and source contracts
        run: |
          node --check scripts/benchmark/native-development-host.mjs
          node --check scripts/benchmark/native-development-child.mjs
          node --check scripts/benchmark/native-dispatch-cli.mjs
          node --check scripts/benchmark/native-dispatch-contract.mjs
          node --test tests/benchmark-native-dispatch-contract.test.mjs tests/benchmark-native-developer-dispatch-workflow.test.mjs
      - name: Qualify real SDK four-phase metered lifecycle with synthetic responses
        env:
          KATIE_BENCHMARK_GATEWAY_DIAGNOSTICS: enabled
        run: node scripts/benchmark/native-four-phase-probe.mjs
      - name: Qualify all four real SDK phases inside isolated sandbox through trusted gateway
        run: node scripts/benchmark/native-four-phase-contained-host-probe.mjs
      - name: Qualify actual SDK plus HTTP gateway inside containment
        run: bash scripts/benchmark/real-codex-gateway-bwrap-probe.sh



