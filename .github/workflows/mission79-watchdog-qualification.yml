name: Mission79 exact watchdog recovery qualification
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261121170000_mission79_watchdog_owner_recovery.sql'
      - 'lib/projects/mission79-retry.ts'
      - 'app/api/projects/organization/route.ts'
      - 'components/mission79-retry-control.tsx'
      - 'tests/mission79-watchdog-recovery-*.test.mjs'
      - 'tests/helpers/assert-mission79-watchdog-native.mjs'
      - 'tests/helpers/assert-mission79-one-retry-native.mjs'
      - 'tests/helpers/assert-blocked-management-retest.mjs'
      - '.github/workflows/mission79-watchdog-qualification.yml'
permissions:
  contents: read
jobs:
  watchdog-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-only
      SUPABASE_SERVICE_ROLE_KEY: synthetic-service-only
      KATIE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated native PostgreSQL 16
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - name: Exact owner authorization and release/alias denial cases
        run: node --test tests/mission79-watchdog-recovery-runtime.test.mjs
      - name: Original 79-mission fixture and actual PostgreSQL watchdog with single scheduler lease
        run: node --test tests/mission79-watchdog-recovery-postgres.test.mjs
