name: Mission83 bounded management context qualification
on:
  pull_request:
    paths:
      - 'lib/projects/management-context.ts'
      - 'tests/management-context.test.mjs'
      - '.github/workflows/mission83-context-qualification.yml'
permissions:
  contents: read
jobs:
  mission83-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-only
      SUPABASE_SERVICE_ROLE_KEY: synthetic-service-only
      KATIE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated native PostgreSQL 16
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - name: Exact 48k overflow, lossless expansion, SMART and exception guard
        run: node --test tests/management-context.test.mjs tests/management-commissioning-diagnostics.test.mjs
      - name: Unchanged native PostgreSQL management hierarchy and admission
        run: node --test tests/project-organization-postgres.test.mjs
