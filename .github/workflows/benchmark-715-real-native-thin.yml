name: Benchmark 715 real Native and Thin paid owner execution

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: benchmark-715-paid-native-thin
  cancel-in-progress: false

jobs:
  run:
    if: >-
      ${{ github.repository == 'mfackrell/katie' &&
          github.actor == github.repository_owner &&
          github.event.issue.user.login == github.repository_owner &&
          github.event.issue.title == '[benchmark-715] Owner-approved paid three-arm execution' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: benchmark-paid
    env:
      KATIE_BENCHMARK_PAID_EXECUTION: enabled
      KATIE_NONFULL_STAGING_ONLY: ${{ secrets.KATIE_NONFULL_STAGING_CONFIRMED }}
      KATIE_NONFULL_STAGING_SUPABASE_URL: ${{ secrets.KATIE_NONFULL_STAGING_SUPABASE_URL }}
      KATIE_NONFULL_STAGING_SERVICE_ROLE_KEY: ${{ secrets.KATIE_NONFULL_STAGING_SERVICE_ROLE_KEY }}
      KATIE_NONFULL_STAGING_OWNER_ID: ${{ secrets.KATIE_NONFULL_STAGING_OWNER_ID }}
      KATIE_NONFULL_PRODUCTION_SUPABASE_URL: ${{ secrets.KATIE_NONFULL_PRODUCTION_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Owner-admit matching staging trial and enforce dollar limit
        id: owner_admission
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/benchmark/owner-paid-nonfull-bootstrap.mjs "$RUNNER_TEMP/benchmark-715-paid-manifest.json"
      - name: Install pinned native SDK and sandbox dependencies
        id: trusted_runtime
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @openai/codex-sdk@0.164.0
          command -v bwrap >/dev/null || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          command -v socat >/dev/null || (sudo apt-get update && sudo apt-get install -y socat)
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Native candidate — metered real model requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/benchmark/paid-staging-nonfull-runner.mjs "$RUNNER_TEMP/benchmark-715-paid-manifest.json" native "$RUNNER_TEMP/benchmark-715-native-result.json"
      - name: Thin candidate — same tools and spending boundary
        if: ${{ !cancelled() && steps.owner_admission.outcome == 'success' && steps.trusted_runtime.outcome == 'success' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/benchmark/paid-staging-nonfull-runner.mjs "$RUNNER_TEMP/benchmark-715-paid-manifest.json" thin "$RUNNER_TEMP/benchmark-715-thin-result.json"
      - name: Preserve trial and review evidence for canonical reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-715-paid-native-thin-evidence
          path: |
            ${{ runner.temp }}/benchmark-715-paid-manifest.json
            ${{ runner.temp }}/benchmark-715-native-result.json
            ${{ runner.temp }}/benchmark-715-thin-result.json
          if-no-files-found: warn
