name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gate:
    runs-on: ubuntu-24.04
    # Full offline suite and LibreOffice acceptance share this job; Ubuntu
    # package mirror latency previously exhausted the 20-minute limit after
    # all 2,451 offline tests and the build had already passed.
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use signed Ubuntu archive mirror
        run: |
          # The previously preferred kernel.org mirror stalled both hosted jobs.
          # Use official Ubuntu archives; retain the runner's signed APT sources.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
          if test -f /etc/apt/apt-mirrors.txt; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          # Fail promptly on network trouble rather than exhausting the job timer.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/90-katie-ci-apt >/dev/null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install filesystem isolation
        run: |
          command -v bwrap >/dev/null || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          # This disposable job VM must permit the verifier's user namespaces.
          # Network/filesystem isolation remains mandatory; no unsandboxed fallback.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - name: Install PostgreSQL 16 for isolated integration tests
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb

      - name: Install available PostgreSQL fixture server
        run: |
          if ! find /usr/lib/postgresql -path '*/bin/initdb' -type f 2>/dev/null | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          PG_INITDB="$(find /usr/lib/postgresql -path '*/bin/initdb' -type f | sort -V | tail -n 1)"
          test -x "$PG_INITDB"
          echo "KATIE_TEST_PG_BIN=$(dirname "$PG_INITDB")" >> "$GITHUB_ENV"

      - name: Verify same-task owner renewal in isolated PostgreSQL and Chromium
        run: node --test tests/benchmark-renewal-postgres.test.mjs tests/benchmark-development-renewal-browser.test.mjs

      - name: Verify explicitly approved amendment successor without inference
        env:
          KATIE_TEST_COMPLETION_CONTROLS: '1'
          KATIE_TEST_AMENDMENT_SUCCESSOR: '1'
        run: node --test tests/benchmark-renewal-postgres.test.mjs

      - name: Qualify lifecycle owner amendment in actual PostgreSQL without inference
        env:
          KATIE_TEST_COMPLETION_CONTROLS: '1'
          KATIE_TEST_AMENDMENT_SUCCESSOR: '1'
          KATIE_TEST_CAPACITY_RENEWAL: '1'
          KATIE_TEST_LIFECYCLE_AUTHORIZATION: '1'
        run: node --test tests/benchmark-renewal-postgres.test.mjs

      - name: Run strict CI gate (typecheck + all offline tests + build + smoke)
        run: npm run ci:gate

      - name: Verify generated Word document in a standard office application
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation
          node scripts/document-word-acceptance.mjs

      - name: Upload document acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-production-acceptance
          path: test-artifacts/documents/
          if-no-files-found: error

      - name: Upload standalone status rail Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-status-rail-screenshots
          path: test-artifacts/standalone-rail/*.png
          if-no-files-found: ignore

      - name: Workspace navigation and continuity in Chromium
        env:
          KATIE_UI_START_SERVER: "1"
          KATIE_UI_SERVER_MODE: start
        run: node scripts/workspace-ui-acceptance.mjs

      - name: Real Chromium Signal Sprint acceptance
        env:
          SIGNAL_SPRINT_BROWSER_ACCEPTANCE: "1"
        run: node --test tests/game-development/signal-sprint.test.mjs

      - name: Presentation renderer browser acceptance
        run: node scripts/presentation-browser-acceptance.mjs

  review-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test resumable required review and actor isolation
        run: npm run test:review

  video-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Gemini Qwen Grok fallback
        run: npm run test:video-fallback



  native-verifier-environment:
    name: Native verifier PostgreSQL and saved Task 4A acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use signed Ubuntu archive mirror
        run: |
          # The previously preferred kernel.org mirror stalled both hosted jobs.
          # Use official Ubuntu archives; retain the runner's signed APT sources.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Fq 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
          if test -f /etc/apt/apt-mirrors.txt; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          # Fail promptly on network trouble rather than exhausting the job timer.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/90-katie-ci-apt >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Prepare native verifier isolation and PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat postgresql-16
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Actual isolated PostgreSQL concurrency and passing/failing WIP preservation
        env:
          KATIE_VERIFY_NATIVE_ENV: '1'
        run: node --test tests/project-verifier-environment.test.mjs tests/native-wip-checkpoint.test.mjs
      - name: Verify unchanged saved application with trusted candidate verifier
        run: |
          set -euo pipefail
          git fetch origin 1d51f2fa7f95fec1cb8c777c0525402e05f34f8e
          test "$(git rev-parse '1d51f2fa7f95fec1cb8c777c0525402e05f34f8e^{tree}')" = 26869fb977fd29b4f96652b9de3d47e0f0e0ffeb
          mkdir "$RUNNER_TEMP/project-tools"
          cp scripts/project-*.mjs scripts/recovery-scope.mjs "$RUNNER_TEMP/project-tools/"
          cp tests/fixtures/task4a-verifier-request.md "$RUNNER_TEMP/task4a-request.md"
          git clone --no-hardlinks . "$RUNNER_TEMP/task4a-candidate"
          git -C "$RUNNER_TEMP/task4a-candidate" checkout --detach 1d51f2fa7f95fec1cb8c777c0525402e05f34f8e
          cd "$RUNNER_TEMP/task4a-candidate"
          node "$RUNNER_TEMP/project-tools/project-scope.mjs" "$RUNNER_TEMP/task4a-request.md"
          set +e
          node "$RUNNER_TEMP/project-tools/project-ci.mjs" --request "$RUNNER_TEMP/task4a-request.md" --output "$RUNNER_TEMP/task4a-acceptance.json" > "$RUNNER_TEMP/task4a-verification.log" 2>&1
          result=$?
          set -e
          tail -100 "$RUNNER_TEMP/task4a-verification.log"
          test "$(git rev-parse 'HEAD^{tree}')" = 26869fb977fd29b4f96652b9de3d47e0f0e0ffeb
          test -z "$(git status --porcelain)"
          exit "$result"
      - name: Preserve nonbillable verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task4a-native-verifier-evidence
          path: |
            ${{ runner.temp }}/task4a-verification.log
            ${{ runner.temp }}/task4a-acceptance.json
            ${{ runner.temp }}/project-test-diagnostics-*/standalone-rail/*.png
          if-no-files-found: warn
          retention-days: 30
